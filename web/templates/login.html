{{define "login.html"}}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#141312" media="(prefers-color-scheme: dark)">
    <title>Anmelden – Haushalts-App</title>
    <link rel="stylesheet" href="{{static "style.css"}}">
</head>
<body class="auth-page">
    <section class="card auth-card">
        <div class="brand-mark">🏠</div>
        <h1>Anmelden</h1>
        {{if .ErrorMsg}}
        <div class="banner banner-error">⚠️ {{.ErrorMsg}}</div>
        {{end}}
        <form method="POST" action="/login" class="form-grid">
            <label>Name<br>
                <input type="text" name="name" required autofocus>
            </label>
            <label>Passwort<br>
                <input type="password" name="password" required>
            </label>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary" style="width:100%">Anmelden</button>
            </div>
        </form>
        <p class="auth-switch">Noch kein Konto? <a href="/register">Registrieren</a></p>
    </section>
</body>
</html>
{{end}}
